name: flutterdex
description: "A Flutter Pokedex!"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  auto_route: ^10.1.0+1
  cached_network_image: ^3.3.1
  clean_arch_core:
    git:
      url: https://github.com/dhemasnurjaya/clean-arch-core
      ref: main
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.7.0
  freezed_annotation: ^3.1.0
  get_it: ^8.0.2
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  url_launcher: ^6.2.6

dev_dependencies:
  auto_route_generator: ^10.2.3
  build_runner: ^2.4.10
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pokeapi.sqlite3
    - assets/sprites/pokemon/
